<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIA MAYS — привет!</title>
<meta name="description" content="Приветствие MIA: кошкодевочка встречает гостей у порога своего уютного дома.">
<meta name="theme-color" content="#F5B8D4">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800;900&subset=cyrillic&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{if(sessionStorage.getItem("mia-intro")==="1"&&!/intro=1/.test(location.search))location.replace("home.html")}catch(e){}</script>
</head>
<body class="intro-page">
<div class="petals" aria-hidden="true"></div>

<main id="main">

<div class="intro-top">
  <a class="logo" href="home.html">MIA <span>MAYS</span> ♡</a>
  <div class="nav-tools"><button class="icon-btn sound-toggle" id="soundToggle" aria-pressed="false" aria-label="Звуки: выключены" title="Звуки">🔇</button><a class="skip-intro" id="skipIntro" href="home.html">Пропустить →</a></div>
</div>
<section class="intro" aria-label="Приветствие">
  <div class="intro-stage">
    <figure class="intro-portrait enter-loop" id="introPortrait">
      <div class="frame"><img src="img/mia-pillow.jpg" alt="MIA в розовой толстовке обнимает подушку и смущённо смотрит на гостя" width="937" height="1400"><span class="blink" aria-hidden="true"></span></div>
      <span class="ear-spark l" aria-hidden="true"></span><span class="ear-spark r" aria-hidden="true"></span>
      <figcaption class="name-tag">MIA</figcaption>
    </figure>
    <div class="speech" id="speech" aria-live="polite">
      <div class="bubble-line" id="bubble"><span id="speechText"></span><span class="caret" aria-hidden="true"></span></div>
      <div class="speech-dots" id="speechDots" aria-hidden="true"></div>
      <div class="speech-ctrl"><button class="btn ghost small" id="speechNext">Дальше</button><button class="btn ghost small" id="speechAll">Показать всё</button></div>
      <ol class="speech-log sr-only" id="speechLog"></ol>
    </div>
  </div>
  <div class="intro-cta reveal in">
    <h1 class="split">Добро пожаловать в мой дом</h1>
    <button class="btn huge" id="enterHouse"><span class="rep" aria-hidden="true"><span>Войти в дом</span><span>Войти в дом</span><span>Войти в дом</span></span><span class="sr-only">Войти в дом</span></button>
    <p class="note">Можно и <a href="home.html" id="skipIntro2">пропустить приветствие</a> — я не обижусь.</p>
  </div>
</section>
<div class="houses" id="houses" aria-hidden="true" hidden>
  <div class="houses-sky"></div>
  <div class="houses-row">
    <div class="house h1"><div class="roof"></div><div class="body"><span class="win"></span><div class="doorway"><span class="light"></span><span class="hdoor"></span></div></div></div>
    <div class="house h2"><div class="roof"></div><div class="body"><span class="win"></span><div class="doorway"><span class="light"></span><span class="hdoor"></span></div></div></div>
    <div class="house h3 main"><div class="roof"></div><div class="body"><span class="win"></span><div class="doorway"><span class="light"></span><span class="hdoor"></span></div></div></div>
    <div class="house h4"><div class="roof"></div><div class="body"><span class="win"></span><div class="doorway"><span class="light"></span><span class="hdoor"></span></div></div></div>
    <div class="house h5"><div class="roof"></div><div class="body"><span class="win"></span><div class="doorway"><span class="light"></span><span class="hdoor"></span></div></div></div>
  </div>
  <div class="houses-ground"></div>
</div>
</main>

<script src="app.js"></script>
</body></html>
